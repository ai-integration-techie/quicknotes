# stage commands). Humans read it; humans approve in the artifacts
# themselves (Status: approved), not here.
#
# Stage status: pending -> in_progress -> awaiting_approval -> approved -> done
#               (or blocked, with a reason). Non-gated stages skip
#               awaiting_approval/approved and go straight to done.

