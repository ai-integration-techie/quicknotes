open_questions: []          # questions relayed to humans and not yet answered

tracker:                    # Jira mode only (team.yaml tracker.mode: jira); ignored otherwise
  epic: null                # e.g. PROJ-123 (authoritative; an artifact's "Jira:" header may say "pending")
  source_issue: null        # imported non-Epic issue linked to the Epic, if any
